<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Phase 6 KOKUEN app-directory consistency starter for Alles.">
  <title>Alles apps - Phase 6 consistency starter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --text: #eceae6;
      --soft: #b9b5b0;
      --muted: #85817c;
      --quiet: #5f5c58;
      --raised: #141414;
      --line: #292929;
      --accent: #9298ff;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family, "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-feature-settings: "cv11", "ss01", "ss03";
      -webkit-font-smoothing: antialiased;
    }

    body { min-height: 100dvh; }
    button, a { font: inherit; }
    button { appearance: none; color: inherit; }

    ::selection {
      background: rgba(146, 152, 255, 0.32);
      color: var(--text);
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 4;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--raised);
      color: var(--text);
      font-size: 0.78rem;
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .shell {
      width: min(1120px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 clamp(20px, 3vw, 34px) 28px;
    }

    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .wordmark,
    .home-link {
      text-decoration: none;
      transition: color 130ms var(--ease);
    }

    .wordmark {
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 620;
      letter-spacing: -0.02em;
    }

    .home-link { color: var(--muted); }
    .home-link:hover { color: var(--text); }

    main { padding-top: clamp(38px, 6vh, 58px); }

    h1 {
      font-size: clamp(2rem, 5vw, 2.7rem);
      font-weight: 500;
      letter-spacing: -0.032em;
      line-height: 1.08;
    }

    .directory {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(38px, 5vw, 64px);
      margin-top: clamp(38px, 6vh, 56px);
    }

    .group-title {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .app-list {
      display: grid;
      gap: 4px;
      list-style: none;
    }

    .app-button {
      position: relative;
      width: calc(100% + 16px);
      min-height: 58px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 12px;
      align-items: center;
      gap: 12px;
      margin-left: -8px;
      padding: 8px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 130ms var(--ease), transform 130ms var(--ease);
    }

    .app-button:hover,
    .app-button:focus-visible { background: var(--raised); }

    .app-button:active { transform: translateY(1px); }

    .app-icon {
      width: 20px;
      height: 20px;
      color: var(--muted);
      transition: color 130ms var(--ease);
    }

    .app-button:hover .app-icon,
    .app-button:focus-visible .app-icon { color: var(--text); }

    .app-copy { min-width: 0; }

    .app-name {
      display: block;
      color: var(--soft);
      font-size: 0.96rem;
      font-weight: 540;
      line-height: 1.25;
    }

    .app-description {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      color: var(--quiet);
      font-size: 0.76rem;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .app-arrow {
      color: var(--quiet);
      font-size: 0.82rem;
      opacity: 0;
      transform: translateX(-3px);
      transition: color 130ms var(--ease), opacity 130ms var(--ease), transform 130ms var(--ease);
    }

    .app-button:hover .app-arrow,
    .app-button:focus-visible .app-arrow {
      color: var(--soft);
      opacity: 1;
      transform: translateX(0);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 24px;
      margin-top: clamp(44px, 7vh, 64px);
      color: var(--quiet);
      font-size: 0.74rem;
    }

    .settings-button {
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.76rem;
      cursor: pointer;
      transition: color 130ms var(--ease);
    }

    .settings-button:hover { color: var(--text); }

    .status {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 3;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--raised);
      color: var(--soft);
      font-size: 0.76rem;
      opacity: 0;
      transform: translate(-50%, 4px);
      pointer-events: none;
      transition: opacity 140ms var(--ease), transform 140ms var(--ease);
    }

    .status.show { opacity: 1; transform: translate(-50%, 0); }

    :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    @media (max-width: 780px) {
      main { padding-top: 34px; }
      .directory {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 38px 46px;
        margin-top: 38px;
      }
    }

    @media (max-width: 540px) {
      .shell { padding-inline: 18px; }
      main { padding-top: 34px; }
      h1 { font-size: 2rem; letter-spacing: -0.02em; }
      .directory {
        grid-template-columns: 1fr;
        gap: 28px;
        margin-top: 32px;
      }
      .app-button { min-height: 56px; }
      .footer { margin-top: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#apps">skip to apps</a>

  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="home.html">alles</a>
      <a class="home-link" href="home.html">home</a>
    </header>

    <main id="apps">
      <header class="page-head">
        <h1>apps</h1>
      </header>

      <div class="directory" aria-label="Alles apps">
        <section class="app-group" aria-labelledby="everyday-title">
          <h2 class="group-title" id="everyday-title">everyday</h2>
          <ul class="app-list">
            <li>
              <button class="app-button" type="button" data-app="plan">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1.5"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>
                <span class="app-copy"><span class="app-name">plan</span><span class="app-description">calendar · tasks · reminders</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
            <li>
              <button class="app-button" type="button" data-app="docs">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v5h5M9 13h6M9 17h5"></path></svg>
                <span class="app-copy"><span class="app-name">docs</span><span class="app-description">notes · journal · knowledge</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
            <li>
              <button class="app-button" type="button" data-app="files">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7h6l2-2h9v14h-17z"></path></svg>
                <span class="app-copy"><span class="app-name">files</span><span class="app-description">local · online · photos</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
          </ul>
        </section>

        <section class="app-group" aria-labelledby="personal-title">
          <h2 class="group-title" id="personal-title">personal</h2>
          <ul class="app-list">
            <li>
              <button class="app-button" type="button" data-app="inbox">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"></rect><path d="m4 7 8 6 8-6"></path></svg>
                <span class="app-copy"><span class="app-name">inbox</span><span class="app-description">mail · contacts</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
            <li>
              <button class="app-button" type="button" data-app="library">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15 5l4-1 2 15-4 1z"></path></svg>
                <span class="app-copy"><span class="app-name">library</span><span class="app-description">books · watchlist · saved news</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
            <li>
              <button class="app-button" type="button" data-app="health">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 0 1 7-2.6A4 4 0 0 1 20 8Z"></path><path d="m8 11 2-2 2 4 2-3 2 1"></path></svg>
                <span class="app-copy"><span class="app-name">health</span><span class="app-description">health log · habits</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
          </ul>
        </section>

        <section class="app-group" aria-labelledby="manage-title">
          <h2 class="group-title" id="manage-title">manage</h2>
          <ul class="app-list">
            <li>
              <button class="app-button" type="button" data-app="finance">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="1.5"></rect><path d="M3 10h18M16 14h2"></path></svg>
                <span class="app-copy"><span class="app-name">finance</span><span class="app-description">budget · accounts · subscriptions</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
            <li>
              <button class="app-button" type="button" data-app="passwords">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="1.5"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 15v2"></path></svg>
                <span class="app-copy"><span class="app-name">passwords</span><span class="app-description">encrypted credentials · secure items</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
            <li>
              <button class="app-button" type="button" data-app="server">
                <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1"></rect><rect x="4" y="14" width="16" height="6" rx="1"></rect><path d="M8 7h.01M8 17h.01M12 7h5M12 17h5"></path></svg>
                <span class="app-copy"><span class="app-name">server</span><span class="app-description">services · backups · storage</span></span>
                <span class="app-arrow" aria-hidden="true">→</span>
              </button>
            </li>
          </ul>
        </section>
      </div>

      <footer class="footer">
        <button class="settings-button" id="settings-button" type="button">settings</button>
      </footer>
    </main>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <script>
    const status = document.querySelector("#status");
    let statusTimer;

    function showStatus(message) {
      status.textContent = message;
      status.classList.add("show");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove("show"), 1500);
    }

    document.querySelectorAll("[data-app]").forEach((button) => {
      button.addEventListener("click", () => showStatus(`${button.dataset.app} would open here`));
    });

    document.querySelector("#settings-button").addEventListener("click", () => showStatus("settings would open here"));
  </script>
</body>
</html>
